[project]
name = "backend"
version = "0.2.0"
description = "FastAPI backend for skilld"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "redis>=5.0.4",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",    # async HTTP client for GitHub REST API
    "pyyaml>=6.0.1",    # parse sources.yaml + SKILL.md frontmatter
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",   # async SQLite for tests that don't need Postgres
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
